<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab — Infrastructure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060610;color:#c9d1d9;font:11px/1.3 'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 40%,#1a1040 0%,transparent 60%),radial-gradient(ellipse at 70% 60%,#0a1a30 0%,transparent 60%),repeating-linear-gradient(45deg,transparent,transparent 60px,rgba(108,71,255,.02)60px,rgba(108,71,255,.02)61px),repeating-linear-gradient(-45deg,transparent,transparent 60px,rgba(0,200,255,.015)60px,rgba(0,200,255,.015)61px);z-index:-1}
header{position:fixed;top:0;left:0;width:100%;padding:8px 16px;background:linear-gradient(180deg,#0a0a18,transparent);z-index:10;display:flex;justify-content:space-between;align-items:center}
h1{font-size:.85rem;font-weight:700;color:#e0e0ff;letter-spacing:2px}
.legend{display:flex;gap:12px;font-size:.5rem;color:#5a5a7a}
.legend span{display:flex;align-items:center;gap:3px}
.led{width:6px;height:6px;border-radius:50%}
.led-g{background:#3fb950;box-shadow:0 0 5px #3fb95088}
.led-y{background:#d29922;box-shadow:0 0 5px #d2992288}
.led-r{background:#f85149;box-shadow:0 0 5px #f8514988;filter:blur(1.5px)}
.back{color:#48486a;font-size:.5rem;text-decoration:none;cursor:pointer}
.back:hover{color:#6C47FF}
/* Canvas layer */
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
/* Node cards positioned absolutely */
.nodes{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.node{position:absolute;pointer-events:all;cursor:pointer;transition:all .3s;border-radius:16px 6px 16px 6px;padding:8px 10px;background:linear-gradient(135deg,rgba(20,20,50,.95),rgba(10,10,30,.95));border:1px solid rgba(108,71,255,.3);min-width:100px}
.node:hover{z-index:20;transform:scale(1.08);border-color:#6C47FF;box-shadow:0 0 20px rgba(108,71,255,.3)}
.node .n-name{font-size:.65rem;font-weight:700;color:#e0e0ff;white-space:nowrap}
.node .n-stat{font-size:.5rem;margin-top:1px;font-weight:600}
.node .n-pct{font-size:.45rem;color:#6b6b8a;margin-top:1px}
.node .led-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%}
.node.green .led-dot{background:#3fb950;box-shadow:0 0 6px #3fb95088}
.node.yellow .led-dot{background:#d29922;box-shadow:0 0 6px #d2992288}
.node.red .led-dot{background:#f85149;box-shadow:0 0 6px #f8514988}
.node.green .n-stat{color:#3fb950}
.node.yellow .n-stat{color:#d29922}
.node.red .n-stat{color:#f85149}
/* Code panel */
#codePanel{position:fixed;bottom:0;left:0;width:100%;height:25vh;background:#0a0a18;border-top:1px solid #2a2a50;z-index:30;display:none;flex-direction:column}
#codePanel.open{display:flex}
#codePanel .cp-header{display:flex;justify-content:space-between;padding:6px 12px;background:#111130;font-size:.6rem;color:#6C47FF}
#codePanel .cp-close{background:none;border:none;color:#f85149;cursor:pointer;font-size:.7rem}
#codePanel .cp-body{flex:1;overflow:auto;padding:8px 12px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.55rem;color:#8b949e;white-space:pre-wrap}
footer{position:fixed;bottom:0;left:0;width:100%;text-align:center;font-size:.5rem;color:#3a3a5a;z-index:5;padding:3px}
</style>
</head>
<body>
<header>
<h1>TIGERLAB INFRASTRUCTURE</h1>
<div class="legend">
<span><span class="led led-g"></span>95%+</span>
<span><span class="led led-y"></span>70-94%</span>
<span><span class="led led-r"></span>&lt;70%</span>
</div>
<a class="back" href="/">← Dashboard</a>
</header>
<div class="nodes" id="nodes"></div>
<canvas id="bg"></canvas>
<div id="codePanel">
<div class="cp-header"><span id="cpTitle">Module</span><button class="cp-close" onclick="document.getElementById('codePanel').classList.remove('open')">✕</button></div>
<div class="cp-body" id="cpBody"></div>
</div>
<footer>Real-time status · Auto-refresh 30s</footer>
<script>
const modules=[
  {id:'lead-engine',name:'Lead Engine',x:5,y:10,w:120,h:55,rank:3,color:'green',code:'engine/leads/lead-engine.mjs\n→ 2000 companies MX+US\n→ SQLite + CSV + Oracle DDL'},
  {id:'prospect',name:'Prospect Selector',x:5,y:28,w:110,h:50,rank:4,color:'green',code:'engine/email/prospect-selector.mjs\n→ Scores & segments\n→ Industry + city filters'},
  {id:'product-engine',name:'Product Engine',x:5,y:46,w:115,h:52,rank:5,color:'green',code:'scripts/product-development-engine.mjs\n→ 12 products scored\n→ 20 competitors benchmarked'},
  {id:'rnd-engine',name:'R&D Engine',x:5,y:64,w:105,h:50,rank:4,color:'green',code:'engine/rnd/rnd-engine.mjs\n→ EU market scanning\n→ 25 specialists, 7 regs'},
  {id:'production-gate',name:'Production Gate',x:5,y:80,w:110,h:50,rank:3,color:'green',code:'engine/runtime/production-gate.mjs\n→ 14 checks\n→ GO/NO-GO report'},
  {id:'payments',name:'Payments',x:22,y:10,w:100,h:48,rank:4,color:'green',code:'server/bootstrap/stripe-payment-service.ts\n→ Stripe + PayPal LIVE\n→ No revenue yet'},
  {id:'creative-agent',name:'Creative Agent',x:22,y:28,w:100,h:42,rank:7,color:'yellow',code:'engine/campaigns/creative-agent.mjs\n→ 6-channel campaigns\n⚠️ Needs attention: low quality output'},
  {id:'materializer',name:'Materializer',x:22,y:44,w:108,h:55,rank:2,color:'green',code:'engine/campaigns/campaign-materializer.mjs\n→ MJML emails\n→ Unsplash real images'},
  {id:'quality-verifier',name:'Quality Verifier',x:22,y:60,w:105,h:50,rank:5,color:'green',code:'engine/campaigns/quality-verifier.mjs\n→ Scores per platform spec\n→ 6 checks per campaign'},
  {id:'campaign-cleaner',name:'Campaign Cleaner',x:22,y:76,w:100,h:48,rank:6,color:'green',code:'engine/campaigns/campaign-cleaner.mjs\n→ 1 per product\n→ Auto-archive duplicates'},
  {id:'campaign-router',name:'Router',x:40,y:18,w:90,h:45,rank:6,color:'green',code:'engine/campaigns/campaign-router.mjs\n→ Adapts copy per channel\n→ 6 platform formats'},
  {id:'social-autopilot',name:'Autopilot',x:40,y:38,w:100,h:52,rank:2,color:'green',code:'scripts/traffic/run-autopilot.mjs\n→ LinkedIn+X+FB+TG+DC\n→ --live publishing'},
  {id:'dashboard-monitor',name:'Monitor Bot',x:40,y:56,w:98,h:48,rank:4,color:'green',code:'engine/runtime/dashboard-monitor.mjs\n→ Health every 15min\n→ Trends + predictions'},
  {id:'product-supervisor',name:'Supervisor',x:40,y:72,w:98,h:48,rank:5,color:'green',code:'engine/runtime/product-supervisor.mjs\n→ Lifecycle tracker\n→ Project map'},
  {id:'full-pipeline',name:'Full Pipeline',x:56,y:20,w:110,h:58,rank:1,color:'yellow',code:'engine/runtime/full-pipeline.mjs\n→ 12-step automated flow\n⚠️ Autopilot fix pending'},
];

// Automation % per module (based on ranking 1=best)
const total=modules.length;
const maxRank=Math.max(...modules.map(m=>m.rank));
modules.forEach(m=>{
  m.pct=Math.round(100-((m.rank-1)/maxRank)*35);
  m.w=Math.max(80,Math.min(160,m.w+(maxRank-m.rank+1)*10));
  m.h=Math.max(40,Math.min(70,m.h+(maxRank-m.rank+1)*5));
});

// Draw connections via Canvas
const canvas=document.getElementById('bg');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const ctx=canvas.getContext('2d');

function drawConnections(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const conns=[
    ['lead-engine','prospect'],['prospect','creative-agent'],['creative-agent','materializer'],
    ['materializer','quality-verifier'],['quality-verifier','campaign-cleaner'],
    ['campaign-cleaner','campaign-router'],['campaign-router','social-autopilot'],
    ['social-autopilot','full-pipeline'],['product-engine','quality-verifier'],
    ['rnd-engine','creative-agent'],['production-gate','full-pipeline'],
    ['payments','full-pipeline'],['dashboard-monitor','product-supervisor'],
    ['product-supervisor','full-pipeline']
  ];
  conns.forEach(([from,to])=>{
    const a=modules.find(m=>m.id===from);
    const b=modules.find(m=>m.id===to);
    if(!a||!b)return;
    const ax=(a.x/100)*canvas.width+a.w/2,ay=(a.y/100)*canvas.height+a.h/2;
    const bx=(b.x/100)*canvas.width,by=(b.y/100)*canvas.height+b.h/2;
    // Superconductor style: glow + dash + connector dots
    ctx.save();
    ctx.strokeStyle=a.color==='green'?'rgba(63,185,80,.3)':'rgba(108,71,255,.25)';
    ctx.lineWidth=1.5;ctx.shadowColor=a.color==='green'?'#3fb950':'#6C47FF';ctx.shadowBlur=4;
    ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    // Connector dot at midpoint
    const mx=(ax+bx)/2,my=(ay+by)/2;
    ctx.setLineDash([]);ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(mx,my,2.5,0,Math.PI*2);
    ctx.fillStyle='rgba(108,71,255,.6)';ctx.fill();ctx.strokeStyle='rgba(108,71,255,.8)';ctx.stroke();
    ctx.restore();
  });
}

// Render nodes
const container=document.getElementById('nodes');
modules.forEach(m=>{
  const n=document.createElement('div');
  n.className=`node ${m.color}`;
  n.style.left=m.x+'%';n.style.top=m.y+'%';
  n.style.width=m.w+'px';
  n.innerHTML=`<span class="led-dot"></span><div class="n-name">${m.name}</div><div class="n-stat">${m.color==='red'?'⏳ INACTIVE':m.color==='yellow'?'⚠️ ATTENTION':'● OPERATIONAL'}</div><div class="n-pct">${m.pct}% automation</div>`;
  n.onclick=()=>{
    document.getElementById('cpTitle').textContent=m.name+' — '+m.id;
    document.getElementById('cpBody').textContent=m.code;
    document.getElementById('codePanel').classList.add('open');
  };
  container.appendChild(n);
});

drawConnections();
window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;drawConnections()};
setTimeout(()=>location.reload(),30000);
</script>
</body>
</html>
