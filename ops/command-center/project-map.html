<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab — Project Structure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000011;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
canvas{position:fixed;top:0;left:0;z-index:0}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:all;cursor:pointer;transition:transform .3s,filter .3s}
.node:hover{transform:translate(-50%,-50%) scale(1.3);filter:brightness(1.5)}
.node .icon{font-size:2rem;display:block}
.node .label{font-size:.55rem;color:#0ff;text-shadow:0 0 6px #0ff,0 0 12px #0ff;font-weight:600;margin-top:2px;white-space:nowrap}
.node.green .label{color:#0f0;text-shadow:0 0 6px #0f0,0 0 12px #0f0}
.node.yellow .label{color:#ff0;text-shadow:0 0 6px #ff0,0 0 12px #ff0}
.node.red .label{color:#f44;text-shadow:0 0 6px #f44,0 0 12px #f44}
.line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,#0ff88,transparent);transform-origin:left center;pointer-events:none;z-index:0}
h1{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#0ff;font-size:.9rem;text-shadow:0 0 10px #0ff,0 0 20px #0ff;z-index:2;letter-spacing:3px}
.back{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#0ff;font-size:.6rem;text-decoration:none;z-index:2;cursor:pointer}
.back:hover{text-shadow:0 0 10px #0ff}
</style>
</head>
<body>
<h1>TIGERLAB PROJECT STRUCTURE</h1>
<a class="back" href="/">← Back to Command Center</a>
<div id="overlay"></div>
<script>
const modules = [
  {id:'lead-engine',name:'Lead Engine',x:15,y:20,color:'green',icon:'🗄️'},
  {id:'prospect',name:'Prospect Selector',x:15,y:40,color:'green',icon:'🎯'},
  {id:'creative',name:'Creative Agent',x:35,y:30,color:'green',icon:'🧠'},
  {id:'materializer',name:'Materializer',x:35,y:50,color:'green',icon:'📦'},
  {id:'unifier',name:'Campaign Unifier',x:55,y:40,color:'green',icon:'🔗'},
  {id:'product-engine',name:'Product Engine',x:15,y:65,color:'green',icon:'📊'},
  {id:'product-improver',name:'Product Improver',x:15,y:80,color:'green',icon:'🔧'},
  {id:'gate',name:'Production Gate',x:55,y:15,color:'green',icon:'🛡️'},
  {id:'monitor',name:'Dashboard Monitor',x:55,y:65,color:'green',icon:'🤖'},
  {id:'supervisor',name:'Product Supervisor',x:55,y:80,color:'green',icon:'👁️'},
  {id:'rnd',name:'R&D Engine',x:75,y:30,color:'green',icon:'🔬'},
  {id:'autopilot',name:'Social Autopilot',x:75,y:55,color:'green',icon:'🚀'},
  {id:'pipeline',name:'Full Pipeline',x:45,y:90,color:'green',icon:'⚡'},
  {id:'payments',name:'Payments',x:75,y:75,color:'green',icon:'💳'},
  {id:'us-leads',name:'US Leads',x:85,y:15,color:'yellow',icon:'🇺🇸'},
  {id:'mx-leads',name:'MX Leads',x:5,y:10,color:'green',icon:'🇲🇽'}
];

const connections = [
  ['lead-engine','prospect'],['prospect','creative'],['creative','materializer'],
  ['materializer','unifier'],['unifier','autopilot'],['autopilot','pipeline'],
  ['product-engine','product-improver'],['product-improver','supervisor'],
  ['gate','monitor'],['monitor','supervisor'],['supervisor','pipeline'],
  ['rnd','creative'],['rnd','product-engine'],
  ['payments','pipeline'],['lead-engine','us-leads'],['lead-engine','mx-leads']
];

const container = document.getElementById('overlay');

// Draw connections
connections.forEach(([from,to]) => {
  const a = modules.find(m => m.id === from);
  const b = modules.find(m => m.id === to);
  if (!a || !b) return;
  const line = document.createElement('div');
  line.className = 'line';
  const ax = a.x, ay = a.y, bx = b.x, by = b.y;
  const dx = bx - ax, dy = by - ay;
  const length = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  line.style.cssText = `left:${ax}%;top:${ay}%;width:${length}%;transform:rotate(${angle}deg);opacity:0.4`;
  container.appendChild(line);
});

// Draw nodes
modules.forEach(m => {
  const node = document.createElement('div');
  node.className = `node ${m.color}`;
  node.style.cssText = `left:${m.x}%;top:${m.y}%`;
  node.innerHTML = `<span class="icon">${m.icon}</span><span class="label">${m.name}</span>`;
  node.title = `${m.name} — ${m.color === 'green' ? 'OPERATIONAL' : m.color === 'yellow' ? 'BUILDING' : 'DOWN'}`;
  node.onclick = () => { node.style.transform = node.style.transform.includes('1.3') ? 'translate(-50%,-50%)' : 'translate(-50%,-50%) scale(1.8)'; };
  container.appendChild(node);
});

// Hologram particle effect
const canvas = document.createElement('canvas');
canvas.id = 'particles';
document.body.prepend(canvas);
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = Array.from({length:60},()=>({
  x:Math.random()*canvas.width,y:Math.random()*canvas.height,
  vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
  size:Math.random()*1.5+.3,alpha:Math.random()*.5+.3
}));

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle = `rgba(0,255,255,${p.alpha})`;
    ctx.fill();
  });
  // Scan line effect
  ctx.strokeStyle = 'rgba(0,255,255,0.08)';
  for(let y=0;y<canvas.height;y+=40){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }
  requestAnimationFrame(animate);
}
animate();
window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
</script>
</body>
</html>
