<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab -- Infrastructure</title>
<style>
:root{--deep:#040b14;--card-bg:rgba(10,16,30,.7);--border:rgba(90,110,160,.15);--text:#bcc8dd;--text-dim:#5a6a8a;--accent:#6378b0;--accent-glow:rgba(99,120,176,.3);--green:rgba(100,160,130,.5);--yellow:rgba(160,140,80,.5);--red:rgba(160,90,90,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--deep);color:var(--text);font:11px/1.3 'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(40,55,100,.1),transparent 60%),radial-gradient(ellipse at 70% 60%,rgba(30,70,80,.06),transparent 60%);z-index:-1}
header{position:fixed;top:0;left:0;width:100%;padding:10px 18px;background:linear-gradient(180deg,rgba(6,10,20,.95),transparent);z-index:10;display:flex;justify-content:space-between;align-items:center}
h1{font-size:.8rem;font-weight:500;color:var(--text);letter-spacing:2px;text-transform:uppercase}
.legend{display:flex;gap:14px;font-size:.55rem;color:var(--text-dim)}
.legend span{display:flex;align-items:center;gap:4px}
.led{width:5px;height:5px;border-radius:50%}
.led-g{background:var(--green);box-shadow:0 0 5px var(--green)}
.led-y{background:var(--yellow);box-shadow:0 0 5px var(--yellow)}
.led-r{background:var(--red);box-shadow:0 0 5px var(--red)}
.back{color:var(--text-dim);font-size:.5rem;text-decoration:none;cursor:pointer}
.back:hover{color:var(--accent)}
.btn-3d{background:rgba(60,100,130,.12);border:1px solid rgba(90,150,180,.25);color:#c0d8f0;padding:5px 14px;border-radius:5px;font-size:.65rem;font-weight:500;text-decoration:none;cursor:pointer;letter-spacing:.8px}
.btn-3d:hover{background:rgba(60,100,130,.25);border-color:var(--accent)}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.nodes{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.node{position:absolute;pointer-events:all;cursor:pointer;transition:all .3s;border-radius:14px 5px 14px 5px;padding:8px 10px;background:rgba(10,16,30,.88);border:1px solid var(--border);min-width:100px;backdrop-filter:blur(6px)}
.node:hover{z-index:20;transform:scale(1.06);border-color:var(--accent);box-shadow:0 0 16px var(--accent-glow)}
.node .n-name{font-size:.62rem;font-weight:500;color:var(--text);white-space:nowrap}
.node .n-stat{font-size:.5rem;margin-top:1px;font-weight:500}
.node .n-pct{font-size:.45rem;color:var(--text-dim);margin-top:1px}
.node .led-dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
.node.green .led-dot{background:var(--green);box-shadow:0 0 5px var(--green)}
.node.yellow .led-dot{background:var(--yellow);box-shadow:0 0 5px var(--yellow)}
.node.red .led-dot{background:var(--red);box-shadow:0 0 5px var(--red)}
.node.green .n-stat{color:rgba(130,190,150,.8)}
.node.yellow .n-stat{color:rgba(180,160,100,.8)}
.node.red .n-stat{color:rgba(180,110,110,.8)}
#codePanel{position:fixed;bottom:0;left:0;width:100%;height:25vh;background:rgba(6,10,20,.95);border-top:1px solid var(--border);z-index:30;display:none;flex-direction:column;backdrop-filter:blur(10px)}
#codePanel.open{display:flex}
#codePanel .cp-header{display:flex;justify-content:space-between;padding:6px 12px;background:rgba(20,30,50,.5);font-size:.6rem;color:var(--accent)}
#codePanel .cp-close{background:none;border:none;color:var(--red);cursor:pointer;font-size:.7rem}
#codePanel .cp-body{flex:1;overflow:auto;padding:8px 12px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.55rem;color:var(--text-dim);white-space:pre-wrap}
footer{position:fixed;bottom:0;left:0;width:100%;text-align:center;font-size:.5rem;color:var(--text-dim);z-index:5;padding:3px}
</style>
</head>
<body>
<header>
<h1>TigerLab Infrastructure</h1>
  <div class="legend">
    <span><span class="led led-g"></span>95%+</span>
    <span><span class="led led-y"></span>70-94%</span>
    <span><span class="led led-r"></span>&lt;70%</span>
  </div>
  <div class="actions" style="display:flex;align-items:center;gap:8px">
    <a href="/project-map-3d.html" class="btn-3d" title="Porque en 2D ya te aburriste">3D VIEW</a>
    <a class="back" href="/" title="Huir a la seguridad del dashboard">Dashboard</a>
  </div>
</header>
<div class="nodes" id="nodes"></div>
<canvas id="bg"></canvas>
<div id="codePanel">
<div class="cp-header"><span id="cpTitle">Module</span><button class="cp-close" onclick="document.getElementById('codePanel').classList.remove('open')">X</button></div>
<div class="cp-body" id="cpBody"></div>
</div>
<footer>Real-time status -- Auto-refresh 30s</footer>
<script>
const modules=[
  {id:'lead-engine',name:'Lead Engine',x:2,y:25,w:72,h:38,rank:7,color:'green',code:'engine/leads/lead-engine.mjs\n-- 2,000+ empresas MX+US en SQLite\n-- Exportacion CSV con segmentacion\n-- Conexion directa a DENUE-INEGI'},
  {id:'prospect',name:'Prospect',x:13,y:20,w:78,h:42,rank:6,color:'green',code:'engine/email/prospect-selector.mjs\n-- ICP scoring por industria y tamano\n-- Segmentacion: fintech, saas, legal, retail\n-- Filtro de leads calificados >70pts'},
  {id:'creative-agent',name:'Creative',x:24,y:32,w:82,h:36,rank:8,color:'yellow',code:'engine/campaigns/creative-agent.mjs\n-- Genera copy para 6 canales simultaneos\n-- Aprendizaje continuo con memoria persistente\n-- Calidad variable, necesita Materializer'},
  {id:'materializer',name:'Materializer',x:36,y:18,w:95,h:52,rank:2,color:'green',code:'engine/campaigns/campaign-materializer.mjs\n-- Renderiza emails profesionales con MJML\n-- Busca imagenes reales en Unsplash\n-- Arma packs completos por canal'},
  {id:'quality-verifier',name:'Quality',x:48,y:25,w:92,h:48,rank:4,color:'green',code:'engine/campaigns/quality-verifier.mjs\n-- 6 validaciones por campana generada\n-- Verifica specs de cada plataforma\n-- Rechaza copy generico o inflado'},
  {id:'campaign-cleaner',name:'Cleaner',x:58,y:32,w:88,h:42,rank:5,color:'green',code:'engine/campaigns/campaign-cleaner.mjs\n-- Mantiene 1 campana activa por producto\n-- Auto-archiva campanas viejas\n-- Libera recursos del pipeline'},
  {id:'campaign-router',name:'Router',x:68,y:22,w:95,h:50,rank:3,color:'green',code:'engine/campaigns/campaign-router.mjs\n-- Distribuye a 6 plataformas (LI, X, FB, TG, DC)\n-- Adapta formato por canal\n-- Genera UTM tracking por destino'},
  {id:'social-autopilot',name:'Autopilot',x:80,y:15,w:105,h:56,rank:2,color:'green',code:'scripts/traffic/run-autopilot.mjs\n-- Publica en 5 canales simultaneos en vivo\n-- Soporta --live publishing mode\n-- Conecta con APIs de redes sociales'},
  {id:'full-pipeline',name:'Pipeline',x:92,y:10,w:110,h:62,rank:1,color:'yellow',code:'engine/runtime/full-pipeline.mjs\n-- Flujo completo de 12 pasos extremo a extremo\n-- Del lead hasta la publicacion automatizada\n-- Pendiente: ajuste de pack semanal'},
  {id:'product-engine',name:'Product Engine',x:2,y:60,w:75,h:40,rank:6,color:'green',code:'scripts/product-development-engine.mjs\n-- 12 productos puntuados con benchmarks\n-- 8 dimensiones de evaluacion\n-- Roadmap generado cada 2 horas'},
  {id:'rnd-engine',name:'R&D Engine',x:14,y:60,w:78,h:40,rank:5,color:'green',code:'engine/rnd/rnd-engine.mjs\n-- Escanea mercado EU (ProductHunt, Sifted, Tech.eu)\n-- 25 especialistas puntuando ideas\n-- Decide: INVEST / ZOMBIE / KILL en 24h'},
  {id:'production-gate',name:'Gate',x:30,y:65,w:80,h:38,rank:5,color:'green',code:'engine/runtime/production-gate.mjs\n-- 14 verificaciones criticas\n-- GO / NO-GO antes de cada release\n-- Bloquea despliegues sin evidencia'},
  {id:'payments',name:'Payments',x:48,y:65,w:85,h:42,rank:4,color:'green',code:'server/bootstrap/stripe-payment-service.ts\n-- Stripe + PayPal integrados en vivo\n-- Webhooks de pago confirmados\n-- Conciliacion y facturacion automatica'},
  {id:'dashboard-monitor',name:'Monitor',x:65,y:68,w:78,h:36,rank:6,color:'yellow',code:'engine/runtime/dashboard-monitor.mjs\n-- Monitoreo de salud cada 15 minutos\n-- Estado: recuperacion de servicio\n-- Alerta temprana de fallos',dead:true},
  {id:'product-supervisor',name:'Supervisor',x:80,y:68,w:82,h:36,rank:5,color:'yellow',code:'engine/runtime/product-supervisor.mjs\n-- Tracker de ciclo de vida de producto\n-- Estado: reconexion de dependencias\n-- Decide keep / iterate / retire',dead:true},
];

const total=modules.length;
const maxRank=Math.max(...modules.map(m=>m.rank));
modules.forEach(m=>{
  m.pct=Math.round(100-((m.rank-1)/maxRank)*35);
  m.w=Math.max(80,Math.min(160,m.w+(maxRank-m.rank+1)*10));
  m.h=Math.max(40,Math.min(70,m.h+(maxRank-m.rank+1)*5));
});

const canvas=document.getElementById('bg');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const ctx=canvas.getContext('2d');

function drawConnections(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const conns=[
    ['lead-engine','prospect'],['prospect','creative-agent'],['creative-agent','materializer'],
    ['materializer','quality-verifier'],['quality-verifier','campaign-cleaner'],
    ['campaign-cleaner','campaign-router'],['campaign-router','social-autopilot'],
    ['social-autopilot','full-pipeline'],
    ['product-engine','quality-verifier'],['rnd-engine','creative-agent'],
    ['production-gate','full-pipeline'],['payments','full-pipeline'],
    ['dashboard-monitor','product-supervisor'],['product-supervisor','full-pipeline']
  ];
  conns.forEach(([from,to])=>{
    const a=modules.find(m=>m.id===from);
    const b=modules.find(m=>m.id===to);
    if(!a||!b)return;
    const ax=(a.x/100)*canvas.width+a.w/2,ay=(a.y/100)*canvas.height+a.h/2;
    const bx=(b.x/100)*canvas.width,by=(b.y/100)*canvas.height+b.h/2;
    ctx.save();
    const isDead=b.color==='red'||b.dead;
    ctx.strokeStyle=isDead?'rgba(150,90,90,.2)':'rgba(100,140,130,.25)';
    ctx.lineWidth=isDead?0.8:1.5;
    ctx.shadowColor=isDead?'rgba(150,90,90,.3)':'rgba(100,150,140,.25)';ctx.shadowBlur=isDead?2:4;
    ctx.setLineDash(isDead?[3,6]:[8,3]);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    const mx=(ax+bx)/2,my=(ay+by)/2;
    ctx.setLineDash([]);ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(mx,my,2.5,0,Math.PI*2);
    ctx.fillStyle=isDead?'rgba(150,90,90,.35)':'rgba(100,150,140,.4)';
    ctx.fill();ctx.strokeStyle=isDead?'rgba(150,90,90,.4)':'rgba(100,150,140,.5)';
    ctx.lineWidth=0.7;ctx.stroke();
    ctx.restore();
  });
}

const container=document.getElementById('nodes');
modules.forEach(m=>{
  const n=document.createElement('div');
  n.className=`node ${m.color}`;
  if(m.dead)n.classList.add('inactive');
  n.style.left=m.x+'%';n.style.top=m.y+'%';
  n.style.width=m.w+'px';
  n.innerHTML=`<span class="led-dot"></span><div class="n-name">${m.name}</div><div class="n-stat">${m.dead?'RECOVERY':m.color==='yellow'?'DEGRADED':'OPERATIONAL'}</div><div class="n-pct">${m.pct}% auto</div>`;
  n.onclick=()=>{
    document.getElementById('cpTitle').textContent=m.name;
    document.getElementById('cpBody').textContent=m.code;
    document.getElementById('codePanel').classList.add('open');
  };
  container.appendChild(n);
});

drawConnections();
window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;drawConnections()};
setTimeout(()=>location.reload(),30000);
</script>
</body>
</html>
