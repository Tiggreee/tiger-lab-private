<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab — Infrastructure Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a14;color:#c9d1d9;font:11px/1.4 'Segoe UI',system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
/* Railway-style geometric background */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:
  radial-gradient(circle at 20% 50%,#1a1040 0%,transparent 50%),
  radial-gradient(circle at 80% 20%,#0a1a30 0%,transparent 50%),
  radial-gradient(circle at 50% 80%,#100a20 0%,transparent 50%),
  repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(108,71,255,0.03) 40px,rgba(108,71,255,0.03) 41px),
  repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(0,200,255,0.02) 40px,rgba(0,200,255,0.02) 41px);
z-index:-1}
header{text-align:center;padding:16px 0 8px;border-bottom:1px solid #1a1040;margin-bottom:16px}
h1{font-size:.9rem;font-weight:600;color:#e0e0ff;letter-spacing:2px}
.sub{font-size:.6rem;color:#6b6b8a;margin-top:2px}
.legend{display:flex;justify-content:center;gap:16px;font-size:.55rem;color:#6b6b8a;margin-top:6px}
.legend span{display:flex;align-items:center;gap:4px}
.led{width:7px;height:7px;border-radius:50%;display:inline-block}
.led-green{background:#3fb950;box-shadow:0 0 6px #3fb95088}
.led-yellow{background:#d29922;box-shadow:0 0 6px #d2992288}
.led-red{background:#f85149;box-shadow:0 0 6px #f8514988;filter:blur(1px)}
/* Layout: left=primary, right=secondary */
.map{display:flex;gap:8px;padding:0 12px 20px;position:relative;max-width:1100px;margin:0 auto}
.col{flex:1;display:flex;flex-direction:column;gap:6px;position:relative}
.col.left{flex:1.2}
.col.mid{flex:1}
.col.right{flex:0.8}
/* Cloud-shaped node */
.node{position:relative;background:linear-gradient(135deg,#151530,#0e0e22);border:1px solid #2a2a50;border-radius:20px 8px 20px 8px / 16px 8px 16px 8px;padding:10px 12px;transition:all .25s;text-decoration:none;color:inherit;display:block}
.node:hover{background:linear-gradient(135deg,#1e1e40,#12122e);border-color:#6C47FF;box-shadow:0 0 16px #6C47FF22;transform:translateY(-1px)}
.node .status{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%}
.node .status.green{background:#3fb950;box-shadow:0 0 6px #3fb95088}
.node .status.yellow{background:#d29922;box-shadow:0 0 6px #d2992288}
.node .status.red{background:#f85149;box-shadow:0 0 6px #f8514988;filter:blur(1.5px)}
.node .name{font-size:.7rem;font-weight:600;color:#e0e0ff;margin-bottom:2px;padding-right:12px}
.node .desc{font-size:.55rem;color:#6b6b8a;line-height:1.3}
.node.inactive{opacity:.4;filter:blur(.5px)}
.node.inactive:hover{opacity:.7;filter:none}
/* SVG connection layer */
svg.connections{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
svg.connections line{stroke:#6C47FF;stroke-width:1;opacity:.3;stroke-dasharray:4 2}
svg.connections line.active{stroke:#3fb950;opacity:.4;stroke-dasharray:none;filter:drop-shadow(0 0 3px #3fb95044)}
.col-label{font-size:.55rem;color:#48486a;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;text-align:center}
.gap-col{width:20px;flex-shrink:0;position:relative}
footer{text-align:center;font-size:.55rem;color:#48486a;padding:8px;border-top:1px solid #1a1040}
@media(max-width:800px){.map{flex-direction:column}}
</style>
</head>
<body>
<header>
<h1>TIGERLAB INFRASTRUCTURE</h1>
<div class="sub">97% Autonomous — Railway-style Architecture</div>
<div class="legend">
<span><span class="led led-green"></span>Operational</span>
<span><span class="led led-yellow"></span>Degraded</span>
<span><span class="led led-red"></span>Inactive</span>
</div>
</header>

<div class="map" id="map">
  <!-- Left: Primary / Core -->
  <div class="col left" id="colCore">
    <div class="col-label">CORE ENGINE</div>
  </div>
  
  <!-- Middle: Creation & Quality -->
  <div class="col mid" id="colMid">
    <div class="col-label">CREATION & QA</div>
  </div>
  
  <!-- Right: Distribution & Monitoring -->
  <div class="col right" id="colRight">
    <div class="col-label">DISTRIBUTION</div>
  </div>
</div>

<footer>TigerLab Infrastructure Map · Live Status · Auto-refresh 60s</footer>

<script>
const modules=[
  {col:'left',name:'Lead Engine',desc:'2000 companies. INEGI + US.',status:'green'},
  {col:'left',name:'Prospect Selector',desc:'Scores & segments prospects.',status:'green'},
  {col:'left',name:'Product Engine',desc:'Benchmarks vs 20 competitors.',status:'green'},
  {col:'left',name:'R&D Engine',desc:'EU market scanning. 25 specialists.',status:'green'},
  {col:'left',name:'Production Gate',desc:'14 checks. GO/NO-GO.',status:'green'},
  {col:'left',name:'Payments',desc:'Stripe + PayPal LIVE.',status:'green'},
  {col:'mid',name:'Creative Agent',desc:'6-channel campaigns. Mem tool.',status:'green'},
  {col:'mid',name:'Campaign Materializer',desc:'MJML emails + Unsplash images.',status:'green'},
  {col:'mid',name:'Quality Verifier',desc:'Scores campaigns per platform.',status:'green'},
  {col:'mid',name:'Campaign Cleaner',desc:'1 per product. No duplicates.',status:'green'},
  {col:'right',name:'Campaign Router',desc:'Adapts per channel.',status:'green'},
  {col:'right',name:'Social Autopilot',desc:'Publish linkedin,x,fb,tg,dc.',status:'green'},
  {col:'right',name:'Dashboard Monitor',desc:'Health every 15min.',status:'green'},
  {col:'right',name:'Product Supervisor',desc:'Lifecycle tracker.',status:'green'},
  {col:'right',name:'Full Pipeline',desc:'Daily 6:00 AM CDT.',status:'yellow'}
];

const containers={left:document.getElementById('colCore'),mid:document.getElementById('colMid'),right:document.getElementById('colRight')};

modules.forEach(m=>{
  const node=document.createElement('a');
  node.className='node'+(m.status==='red'?' inactive':'');
  node.href='/';
  node.innerHTML=`<span class="status ${m.status}"></span><div class="name">${m.name}</div><div class="desc">${m.desc}</div>`;
  node.title=`${m.name}: ${m.status==='green'?'Operational':m.status==='yellow'?'Degraded':'Inactive'} — ${m.desc}`;
  const col=m.col==='left'?'left':m.col==='mid'?'mid':'right';
  containers[col].appendChild(node);
});

// Connection lines via SVG
setTimeout(()=>{
  const map=document.getElementById('map');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','connections');
  svg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0';
  map.style.position='relative';
  map.appendChild(svg);
  
  const nodes=document.querySelectorAll('.node');
  const connections=[
    ['Lead Engine','Prospect Selector'],['Prospect Selector','Creative Agent'],
    ['Creative Agent','Campaign Materializer'],['Campaign Materializer','Quality Verifier'],
    ['Quality Verifier','Campaign Cleaner'],['Campaign Cleaner','Campaign Router'],
    ['Campaign Router','Social Autopilot'],['Social Autopilot','Full Pipeline'],
    ['Product Engine','Quality Verifier'],['R&D Engine','Creative Agent'],
    ['Production Gate','Full Pipeline'],['Payments','Full Pipeline'],
    ['Dashboard Monitor','Product Supervisor'],['Product Supervisor','Full Pipeline']
  ];
  
  connections.forEach(([from,to])=>{
    const a=Array.from(nodes).find(n=>n.querySelector('.name').textContent===from);
    const b=Array.from(nodes).find(n=>n.querySelector('.name').textContent===to);
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const mr=map.getBoundingClientRect();
    const x1=ra.right-mr.left,y1=ra.top+ra.height/2-mr.top;
    const x2=rb.left-mr.left,y2=rb.top+rb.height/2-mr.top;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('class','active');
    svg.appendChild(line);
  });
},100);

setTimeout(()=>location.reload(),60000);
</script>
</body>
</html>
