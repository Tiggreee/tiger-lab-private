<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab — 3D Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060610;overflow:hidden;height:100vh;font:11px 'Segoe UI',system-ui,sans-serif;perspective:1200px;cursor:grab}
body:active{cursor:grabbing}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#0a1020 0%,#060610 70%);z-index:-1}
header{position:fixed;top:0;left:0;width:100%;padding:8px 16px;z-index:10;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#060610,transparent)}
h1{font-size:.75rem;font-weight:700;color:#e0e0ff;letter-spacing:2px}
.back{color:#3a3a5a;font-size:.5rem;text-decoration:none}.back:hover{color:#6C47FF}
.hint{font-size:.5rem;color:#48486a}
#scene{position:fixed;top:50%;left:50%;transform-style:preserve-3d;transition:transform .1s linear}
.node{position:absolute;transform-style:preserve-3d;cursor:pointer;transition:filter .3s}
.node .card{background:linear-gradient(135deg,rgba(20,20,50,.95),rgba(10,10,30,.95));border:1px solid rgba(108,71,255,.3);border-radius:12px 4px 12px 4px;padding:6px 8px;text-align:center;color:#c9d1d9;min-width:80px}
.node:hover .card{border-color:#6C47FF;box-shadow:0 0 20px rgba(108,71,255,.4)}
.node .n-name{font-size:.6rem;font-weight:700;color:#e0e0ff;white-space:nowrap}
.node .n-stat{font-size:.45rem;margin-top:1px}
.node.green .n-stat{color:#3fb950}
.node.yellow .n-stat{color:#d29922}
.node.red .n-stat{color:#f85149}
.node.dead{filter:blur(3px);opacity:.3}
.node.dead:hover{filter:none;opacity:1}
.led-dot{width:6px;height:6px;border-radius:50%;margin:0 auto 2px}
.green .led-dot{background:#3fb950;box-shadow:0 0 6px#3fb95088}
.yellow .led-dot{background:#d29922;box-shadow:0 0 6px#d2992288}
.red .led-dot,.dead .led-dot{background:#f85149;box-shadow:0 0 6px#f8514988}
svg.connections{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
svg line{stroke:#6C47FF;stroke-width:1.5;opacity:.4;stroke-dasharray:6 3}
svg line.dead{stroke:#f85149;opacity:.2}
svg circle.connector{fill:#6C47FF;opacity:.6}
footer{position:fixed;bottom:0;left:0;width:100%;text-align:center;font-size:.5rem;color:#3a3a5a;z-index:5;padding:3px}
</style>
</head>
<body>
<header>
<h1>3D INFRASTRUCTURE MAP</h1>
<span class="hint">🖱️ Drag to rotate · Scroll to zoom</span>
<a class="back" href="/">← Dashboard</a>
</header>
<div id="scene"></div>
<svg class="connections" id="connSvg"></svg>
<footer>3D View · Drag to explore</footer>
<script>
const modules=[
  {name:'Lead Engine',x:0,y:60,z:-80,color:'green',dead:false,desc:'2K companies'},
  {name:'Prospect',x:120,y:40,z:-60,color:'green',dead:false,desc:'ICP scoring'},
  {name:'Creative',x:220,y:80,z:-40,color:'yellow',dead:false,desc:'6-channel'},
  {name:'Materializer',x:340,y:30,z:-20,color:'green',dead:false,desc:'MJML+Unsplash'},
  {name:'Quality',x:440,y:50,z:0,color:'green',dead:false,desc:'6 checks'},
  {name:'Cleaner',x:540,y:70,z:20,color:'green',dead:false,desc:'1/product'},
  {name:'Router',x:640,y:40,z:40,color:'green',dead:false,desc:'6 platforms'},
  {name:'Autopilot',x:760,y:20,z:60,color:'green',dead:false,desc:'--live'},
  {name:'Pipeline',x:880,y:10,z:100,color:'yellow',dead:false,desc:'12-step'},
  {name:'Payments',x:700,y:130,z:30,color:'green',dead:false,desc:'Stripe+PP'},
  {name:'Monitor',x:550,y:140,z:-30,color:'yellow',dead:true,desc:'Degraded'},
  {name:'Supervisor',x:650,y:140,z:-50,color:'yellow',dead:true,desc:'Needs fix'},
];

const scene=document.getElementById('scene');
let rotX=-15,rotY=-20,scale=1;
let dragging=false,lastX=0,lastY=0;

function render(){
  scene.style.transform=`translate(-50%,-50%) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;
  // Update connection lines
  const svg=document.getElementById('connSvg');
  svg.innerHTML='';
  const conns=[['Lead Engine','Prospect'],['Prospect','Creative'],['Creative','Materializer'],['Materializer','Quality'],['Quality','Cleaner'],['Cleaner','Router'],['Router','Autopilot'],['Autopilot','Pipeline'],['Payments','Pipeline'],['Monitor','Supervisor'],['Supervisor','Pipeline']];
  conns.forEach(([from,to])=>{
    const a=modules.find(m=>m.name===from),b=modules.find(m=>m.name===to);
    if(!a||!b)return;
    const ax=window.innerWidth/2+(a.x-440)*scale,ay=window.innerHeight/2+(a.y-70)*scale;
    const bx=window.innerWidth/2+(b.x-440)*scale,by=window.innerHeight/2+(b.y-70)*scale;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',ax);line.setAttribute('y1',ay);
    line.setAttribute('x2',bx);line.setAttribute('y2',by);
    if(b.dead)line.classList.add('dead');
    svg.appendChild(line);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',(ax+bx)/2);c.setAttribute('cy',(ay+by)/2);
    c.setAttribute('r','3');c.classList.add('connector');
    svg.appendChild(c);
  });
}

modules.forEach(m=>{
  const n=document.createElement('div');
  n.className=`node ${m.color}${m.dead?' dead':''}`;
  n.style.left=m.x+'px';n.style.top=m.y+'px';
  n.style.transform=`translateZ(${m.z}px)`;
  n.innerHTML=`<div class="card"><div class="led-dot"></div><div class="n-name">${m.name}</div><div class="n-stat">${m.dead?'💀 INACTIVE':m.color==='yellow'?'⚠️':'●'} ${m.desc}</div></div>`;
  n.title=m.name+(m.dead?' (INACTIVE)':'');
  scene.appendChild(n);
});

render();

// Drag to rotate
document.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
document.addEventListener('mousemove',e=>{if(!dragging)return;rotY+=(e.clientX-lastX)*.5;rotX-=(e.clientY-lastY)*.5;lastX=e.clientX;lastY=e.clientY;render()});
document.addEventListener('mouseup',()=>dragging=false);
document.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.5,Math.min(2,scale-e.deltaY*.001));render()},{passive:false});
</script>
</body>
</html>
