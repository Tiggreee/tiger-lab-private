<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TigerLab — 3D Arrow Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060610;overflow:hidden;height:100vh;font:11px 'Segoe UI',system-ui,sans-serif;perspective:1200px;cursor:grab;user-select:none}
body:active{cursor:grabbing}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#0a1020 0%,#060610 70%),repeating-linear-gradient(45deg,transparent,transparent 80px,rgba(108,71,255,.015)80px,rgba(108,71,255,.015)81px);z-index:-1}
header{position:fixed;top:0;left:0;width:100%;padding:8px 16px;z-index:10;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#060610,transparent)}
h1{font-size:.75rem;font-weight:700;color:#e0e0ff;letter-spacing:2px}
.hint{font-size:.5rem;color:#48486a}
.back{color:#3a3a5a;font-size:.5rem;text-decoration:none}.back:hover{color:#6C47FF}
/* Everything inside scene rotates together — centered, 15% viewport margin */
#scene{position:fixed;top:50%;left:50%;width:70vw;height:70vh;transform-style:preserve-3d;transition:transform .08s linear}
.node{position:absolute;transform-style:preserve-3d;cursor:pointer}
.node .card{background:linear-gradient(135deg,rgba(20,20,50,.93),rgba(10,10,30,.93));border:1px solid rgba(108,71,255,.35);border-radius:14px 5px 14px 5px;padding:8px 10px;text-align:center;color:#c9d1d9;min-width:80px}
.node:hover .card{border-color:#6C47FF;box-shadow:0 0 20px rgba(108,71,255,.5)}
.node .n-name{font-size:.55rem;font-weight:700;color:#e0e0ff;white-space:nowrap}
.node .n-pct{font-size:.4rem;color:#6b6b8a}
.led{width:5px;height:5px;border-radius:50%;margin:0 auto 2px}
.led-g{background:#3fb950;box-shadow:0 0 5px#3fb95088}
.led-y{background:#d29922;box-shadow:0 0 5px#d2992288}
.led-r{background:#f85149;box-shadow:0 0 5px#f8514988}
.node.dead{filter:blur(2px);opacity:.3}.node.dead:hover{filter:none;opacity:1}
/* SVG connections inside scene */
#connLayer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
#connLayer line{stroke-width:1.5}
footer{position:fixed;bottom:0;left:0;width:100%;text-align:center;font-size:.5rem;color:#3a3a5a;z-index:5;padding:3px}
</style>
</head>
<body>
<header>
<h1>3D INFRASTRUCTURE — ARROW MAP</h1>
  <span class="hint">Drag to rotate · Scroll to zoom · Rotation clamped ±45° · Scale locked 35%-130%</span>
  <a class="back" href="/project-map.html">← Infrastructure</a>
</header>
<div id="scene">
  <svg id="connLayer" width="900" height="600"></svg>
</div>
<footer>3D Arrow View · Modules + Connections — unified rotation</footer>
<script>
const modules=[
  {name:'Lead Engine',x:40,y:280,z:0,color:'green',dead:false,pct:'95%',desc:'2K companies'},
  {name:'Prospect',x:130,y:260,z:20,color:'green',dead:false,pct:'90%',desc:'ICP scoring'},
  {name:'Creative',x:210,y:300,z:10,color:'yellow',dead:false,pct:'70%',desc:'6-channel ⚠️'},
  {name:'Materializer',x:310,y:240,z:40,color:'green',dead:false,pct:'98%',desc:'MJML+Unsplash'},
  {name:'Quality',x:400,y:260,z:30,color:'green',dead:false,pct:'92%',desc:'6 checks'},
  {name:'Cleaner',x:490,y:290,z:20,color:'green',dead:false,pct:'88%',desc:'1/product'},
  {name:'Router',x:580,y:250,z:50,color:'green',dead:false,pct:'90%',desc:'6 platforms'},
  {name:'Autopilot',x:680,y:220,z:70,color:'green',dead:false,pct:'95%',desc:'--live 5ch'},
  {name:'Pipeline',x:790,y:200,z:100,color:'yellow',dead:false,pct:'82%',desc:'12-step ⚠️'},
  {name:'Payments',x:650,y:370,z:30,color:'green',dead:false,pct:'88%',desc:'Stripe+PP'},
  {name:'Monitor',x:520,y:390,z:-20,color:'yellow',dead:true,pct:'40%',desc:'Degraded 💀'},
  {name:'Supervisor',x:600,y:380,z:-10,color:'yellow',dead:true,pct:'50%',desc:'Needs fix 💀'},
];

const scene=document.getElementById('scene');
const svg=document.getElementById('connLayer');
const W=900,H=600;
let rotX=-15,rotY=-25,scale=0.85,dragging=false,lx=0,ly=0;

function updateConnections(){
  svg.innerHTML='';
  const conns=[['Lead Engine','Prospect'],['Prospect','Creative'],['Creative','Materializer'],['Materializer','Quality'],['Quality','Cleaner'],['Cleaner','Router'],['Router','Autopilot'],['Autopilot','Pipeline'],['Payments','Pipeline'],['Monitor','Supervisor'],['Supervisor','Pipeline']];
  const ns='http://www.w3.org/2000/svg';
  conns.forEach(([from,to])=>{
    const a=modules.find(m=>m.name===from),b=modules.find(m=>m.name===to);
    if(!a||!b)return;
    const ax=a.x+40,ay=a.y+15,bx=b.x+40,by=b.y+15;
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',ax);line.setAttribute('y1',ay);
    line.setAttribute('x2',bx);line.setAttribute('y2',by);
    line.setAttribute('stroke',b.dead?'#f85149':'#3fb950');
    line.setAttribute('opacity',b.dead?'.2':'.5');
    line.setAttribute('stroke-dasharray',b.dead?'3 5':'6 3');
    line.setAttribute('filter',b.dead?'':'url(#glow)');
    svg.appendChild(line);
    // Connector dot
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',(ax+bx)/2);c.setAttribute('cy',(ay+by)/2);
    c.setAttribute('r','4');c.setAttribute('fill',b.dead?'#f85149':'#3fb950');
    c.setAttribute('opacity','.7');svg.appendChild(c);
  });
  // Add glow filter
  if(!document.getElementById('glow')){
    const defs=document.createElementNS(ns,'defs');
    const filter=document.createElementNS(ns,'filter');filter.id='glow';
    filter.innerHTML='<feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(filter);svg.appendChild(defs);
  }
}

// Render all modules
modules.forEach(m=>{
  const n=document.createElement('div');
  n.className=`node${m.dead?' dead':''}`;
  n.style.cssText=`left:${m.x}px;top:${m.y}px;transform:translateZ(${m.z}px)`;
  n.innerHTML=`<div class="card"><div class="led ${m.color==='green'?'led-g':m.color==='yellow'?'led-y':'led-r'}"></div><div class="n-name">${m.name}</div><div class="n-pct">${m.pct} ${m.dead?'💀':''}</div></div>`;
  n.title=`${m.name}: ${m.desc} (${m.pct})`;
  scene.appendChild(n);
});

function render(){
  const clampedX=Math.max(-45,Math.min(45,rotX));
  const clampedY=Math.max(-45,Math.min(45,rotY));
  const clampedScale=Math.max(.35,Math.min(1.3,scale));
  scene.style.transform=`translate(-50%,-50%) rotateX(${clampedX}deg) rotateY(${clampedY}deg) scale(${clampedScale})`;
}
updateConnections();render();

document.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY});
document.addEventListener('mousemove',e=>{if(!dragging)return;rotY+=(e.clientX-lx)*.35;rotX-=(e.clientY-ly)*.35;lx=e.clientX;ly=e.clientY;render()});
document.addEventListener('mouseup',()=>dragging=false);
document.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.35,Math.min(1.3,scale-e.deltaY*.0006));render()},{passive:false});
</script>
</body>
</html>
