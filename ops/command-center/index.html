<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tiger Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:12px/1.4 'Segoe UI',system-ui,sans-serif;background:#0c1117;color:#c9d1d9;padding:10px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #21262d}
.led-row{display:flex;align-items:center;gap:8px}
.led{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.led-green{background:#3fb950;box-shadow:0 0 8px #3fb95088}
h1{font-size:1rem;font-weight:600;color:#f0f6fc}
.gate-badge{font-size:.65rem;padding:1px 7px;border-radius:10px;font-weight:600;text-transform:uppercase}
.gate-go{background:#1a3a2a;color:#3fb950}
.gate-nogo{background:#3a1a1a;color:#f85149}
.actions{display:flex;gap:5px}
.actions button{border:none;padding:4px 10px;border-radius:4px;font-size:.7rem;cursor:pointer;background:#21262d;color:#c9d1d9;font-weight:500}
.actions button:hover{background:#30363d}
.actions .btn-refresh{background:#1f6feb;color:#fff}
.actions .btn-refresh:hover{background:#388bfd}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.kpi{background:#161b22;border:1px solid #21262d;border-radius:5px;padding:8px 10px;text-align:center}
.kpi small{display:block;font-size:.6rem;color:#8b949e;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.kpi b{font-size:1.3rem;font-weight:700;color:#f0f6fc}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:10px;overflow:hidden}
.card h2{font-size:.7rem;font-weight:600;color:#8b949e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.dim{font-size:.65rem;color:#484f58;margin-bottom:4px}
.score-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:.7rem}
.score-bar .name{width:110px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.score-bar .bar{flex:1;height:10px;background:#21262d;border-radius:3px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:3px;min-width:2px}
.score-bar .val{width:26px;text-align:right;font-weight:700;font-size:.65rem;flex-shrink:0}
.alert-item{font-size:.7rem;padding:3px 7px;margin-bottom:3px;border-radius:3px;border-left:3px solid transparent}
.alert-critical{border-color:#f85149;background:#3a1a1a22}
.alert-warn{border-color:#d29922;background:#3a2f1a22}
.alert-info{border-color:#58a6ff;background:#1a2f3a22}
.lead-row{font-size:.7rem;margin-bottom:2px}
.lead-row .lbl{color:#8b949e}
.lead-section{margin-bottom:6px}
.lead-section h3{font-size:.65rem;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.lead-stat{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #21262d22}
.lead-stat:last-child{border-bottom:none}
footer{font-size:.65rem;color:#484f58;text-align:center;padding:6px 0 0;border-top:1px solid #21262d;margin-top:6px}
/* Tiger AI Bot */
.bot-container{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bot-bubble{background:#161b22;border:1px solid #3fb95044;border-radius:8px;padding:8px 12px;max-width:220px;font-size:.65rem;color:#c9d1d9;box-shadow:0 2px 12px #00000044;animation:floatBubble 4s ease-in-out infinite}
.bot-bubble strong{color:#3fb950;display:block;font-size:.6rem;margin-bottom:3px}
.bot-face{width:64px;height:80px;border-radius:50%/45%;border:2px solid #3fb950;background-size:cover;background-position:center;animation:cycleFaces 10s steps(1) infinite;cursor:pointer;box-shadow:0 0 14px #3fb95044;transition:transform .2s}
.bot-face:hover{transform:scale(1.15)}
@keyframes floatBubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes cycleFaces{
0%{background-image:url('/command-center/faces/Copilot_20260613_002326_face.png')}
11.11%{background-image:url('/command-center/faces/Copilot_20260613_002457_face.png')}
22.22%{background-image:url('/command-center/faces/Copilot_20260613_002729_face.png')}
33.33%{background-image:url('/command-center/faces/Copilot_20260613_002939_face.png')}
44.44%{background-image:url('/command-center/faces/Copilot_20260613_003102_face.png')}
55.55%{background-image:url('/command-center/faces/Copilot_20260613_003257_face.png')}
66.66%{background-image:url('/command-center/faces/Copilot_20260613_003439_face.png')}
77.77%{background-image:url('/command-center/faces/Copilot_20260613_003620_face.png')}
88.88%{background-image:url('/command-center/faces/Copilot_20260613_003747_face.png')}
100%{background-image:url('/command-center/faces/Copilot_20260613_002326_face.png')}}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.bot-container{right:6px;bottom:6px}}
</style>
</head>
<body>
<header>
  <div class="led-row">
    <div id="engineLed" class="led led-green" title="Engine RUNNING"></div>
    <h1>Tiger Command Center</h1>
    <span id="systemStatusBadge" class="gate-badge gate-go">GO</span>
  </div>
  <div class="actions">
    <button id="notifyBtn">Alerts</button>
    <button id="refreshBtn" class="btn-refresh">Refresh</button>
  </div>
</header>

<div class="kpi-row" id="kpiRow"></div>

<div class="grid-2">
  <section class="card" id="campaignPanel">
    <h2>🎯 Campaigns</h2>
    <div id="campaignList"></div>
    <div id="campaignDetail"></div>
  </section>
  <section class="card" id="alertsPanel">
    <h2>🤖 Bot Monitor <span id="alertsStatus"></span></h2>
    <div id="alertsTime" class="dim"></div>
    <div id="alertsContent"></div>
  </section>
</div>

<div class="grid-2">
  <section class="card">
    <h2>📊 Product Scores</h2>
    <div id="productScores"></div>
  </section>
  <section class="card">
    <h2>👥 Leads</h2>
    <div id="leadsContent"></div>
  </section>
</div>

<footer id="footerText"></footer>

<div class="bot-container">
  <div class="bot-bubble" id="botBubble">
    <strong>🐯 Tiger AI</strong>
    <span id="botFact">Engine running. Pipeline: 5000.</span>
  </div>
  <div class="bot-face" id="botFace" title="Tiger AI — 12 faces cycling every 0.5s"></div>
</div>

<script src="/command-center/app.js" type="module"></script>
</body>
</html>
