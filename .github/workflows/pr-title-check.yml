name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if [[ "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|hotfix):[[:space:]].+ ]]; then
            echo "Title format OK"
            exit 0
          fi

          echo "Invalid PR title format. Use: feat: ..., fix: ..., hotfix: ..."
          exit 1
