name: daily-sales-automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5'

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1. Lead Intelligence — genera leads desde ICP si no hay nuevos
      - name: Lead Intelligence
        run: node scripts/lead-intelligence.mjs

      # 2. Generate outreach desde leads nuevos
      - name: Generate outreach
        run: |
          node scripts/generate-outreach.mjs --leads ops/leads/pipeline.json || \
          echo "No leads to process or skipped"

      # 3. Generate social pack
      - name: Generate social pack
        run: |
          node scripts/traffic/generate-social-pack.mjs \
            --topic "Automatización de operaciones para SMBs" \
            --audience "founders y operadores SMB" \
            --offer "Diagnóstico de 15 min" \
            --campaign "daily-$(date -u +%Y-%m-%d)" \
            --baseLink "${{ vars.SOCIAL_BASE_LINK || 'https://cal.com/victor-tigerlab/diagnostic' }}" \
            --closeChannel "calendar" \
            --closeDestination "${{ vars.SOCIAL_CLOSE_DESTINATION || 'https://cal.com/victor-tigerlab/diagnostic' }}" \
            --productName "Tiger Lab" \
            --problemDetail "operaciones manuales que consumen 10+h/semana" \
            --primaryOutcome "operaciones autónomas" \
            --proofPoint "2 productos viables: Docflow API y Script Kit" \
            --domainTerms "automatizacion, smb, docflow, scripts"

      # 4. Run autopilot (publish si hay secrets, dry-run si no)
      - name: Run autopilot
        run: |
          node scripts/traffic/run-autopilot.mjs \
            --campaign "daily-$(date -u +%Y-%m-%d)" \
            --channels linkedin,x,facebook,telegram,discord \
            --minChannels 0

      # 5. Dashboard prioritization
      - name: Dashboard prioritization
        run: node scripts/dashboard-prioritize.mjs

      # 6. Generate social landing pages per producto × canal
      - name: Generate social landings
        run: node scripts/traffic/generate-landing-social.mjs

      # 7. Agent monitor — escanea todos los agentes y su contribucion
      - name: Agent monitor
        run: node scripts/agent-monitor.mjs

      # 8. Monetization engine — pricing recommendations
      - name: Monetization engine
        run: node scripts/monetization-engine.mjs

      # 9. Product architect — repo blueprints and changelog
      - name: Product architect
        run: node scripts/product-architect.mjs

      # 10. Supervisor decisions — product evaluation report
      - name: Supervisor decisions
        run: node scripts/supervisor-decision-maker.mjs report

      # 11. Unified dashboard data — consolida todos los dashboards en un JSON
      - name: Unified dashboard data
        run: node scripts/unified-dashboard-data.mjs

      # 9. System verification — valida cada sistema contra sus entradas/salidas
      - name: System verification
        run: node scripts/verify-systems.mjs

      # 10. Generate daily report
      - name: Generate daily report
        run: |
          echo "## Daily Sales Automation" > daily-report.md
          echo "Date: $(date -u)" >> daily-report.md
          echo "Lead intelligence: completed" >> daily-report.md
          echo "Social pack: generated" >> daily-report.md
          echo "Autopilot: completed" >> daily-report.md
          echo "Dashboard: prioritized" >> daily-report.md
          echo "Social landings: generated" >> daily-report.md
          echo "Agent monitor: completed" >> daily-report.md
          echo "Unified dashboard: generated" >> daily-report.md
          echo "System verification: completed" >> daily-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-sales-report
          path: daily-report.md

      - name: Commit all auto-generated assets
        run: |
          git config user.name "tiger-bot"
          git config user.email "bot@tigerlab.dev"
          git add ops/traffic/outbox/ ops/sales/outreach/ ops/leads/ ops/landings/ ops/artifacts/ ops/runtime/agent-monitor.json ops/runtime/dashboard-unified.json ops/runtime/pricing.json ops/runtime/supervisor-report.json ops/runtime/system-verification.json ops/command-center/tasks.json ops/command-center/decisions.json ops/runtime/dashboard-prioritization-report.json
          git diff --cached --quiet || git commit -m "daily-sales: full pipeline $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push or push skipped"
