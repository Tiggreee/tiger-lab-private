name: daily-sales-automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate content
        run: node scripts/generate-content.mjs tiger-lab post linkedin

      - name: Generate social pack
        run: |
          node scripts/traffic/generate-social-pack.mjs \
            --topic "Automatización de operaciones para SMBs" \
            --audience "founders y operadores SMB" \
            --offer "Diagnóstico de 15 min" \
            --campaign "daily-$(date -u +%Y-%m-%d)" \
            --baseLink "${{ vars.SOCIAL_BASE_LINK || 'https://cal.com/victor-tigerlab/diagnostic' }}" \
            --closeChannel "calendar" \
            --closeDestination "${{ vars.SOCIAL_CLOSE_DESTINATION || 'https://cal.com/victor-tigerlab/diagnostic' }}" \
            --productName "Tiger Lab Automation" \
            --problemDetail "operaciones manuales que consumen 10+h/semana" \
            --primaryOutcome "operación autónoma en 2 semanas" \
            --proofPoint "SMB ahorró 15h/semana en su primer sprint" \
            --domainTerms "automatizacion, smb, operaciones, eficiencia"

      - name: Run autopilot (dry-run)
        run: |
          node scripts/traffic/run-autopilot.mjs \
            --campaign "daily-$(date -u +%Y-%m-%d)" \
            --channels linkedin,x,facebook,telegram,discord \
            --minChannels 1

      - name: Generate daily report
        run: |
          echo "## Daily Sales Automation" > daily-report.md
          echo "Date: $(date -u)" >> daily-report.md
          echo "Social pack: generated" >> daily-report.md
          echo "Autopilot: dry-run passed" >> daily-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-sales-report
          path: daily-report.md

      - name: Commit social pack
        run: |
          git config user.name "tiger-bot"
          git config user.email "bot@tigerlab.dev"
          git add ops/traffic/outbox/ ops/content/
          git diff --cached --quiet || git commit -m "daily-sales: auto-generated content $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push or push skipped"
