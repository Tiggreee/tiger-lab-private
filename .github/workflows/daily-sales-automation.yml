name: daily-sales-automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '0 12-20 * * 6'

permissions:
  contents: write

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    environment: production-social
    env:
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 0. Install dependencies
      - name: Install deps
        run: npm ci

      # 1. Lead Engine — seed + enrich + export (P2 checklist)
      - name: Lead Engine
        run: node scripts/lead-engine.mjs --mode seed && node scripts/lead-engine.mjs --mode enrich && node scripts/lead-engine.mjs --mode export

      # 2. Prospect Selector — selecciona prospects de la DB
      - name: Prospect Selector
        run: node engine/email/prospect-selector.mjs general && node engine/email/prospect-selector.mjs facturacion

      # 3. Email Campaign — diseña campaña de email
      - name: Email Campaign
        run: node engine/email/email-campaign.mjs --dry-run

      # 3.5 Campaign Cleaner — 1 per product, no duplicates
      - name: Campaign Cleaner
        run: node engine/campaigns/campaign-cleaner.mjs

      # 4. Campaign Designer — diseño y aprobación
      - name: Campaign Designer
        run: node engine/campaigns/campaign-designer.mjs --product "Docflow API" --target contabilidad --channels email,linkedin --dry-run

      # 5. Generate outreach desde leads nuevos
      - name: Generate outreach
        run: |
          node scripts/generate-outreach.mjs --leads ops/leads/pipeline.json || \
          echo "No leads to process or skipped"

      # 3. Full campaign pipeline — catalog → threads → copy → PNG cards (zero params)
      - name: Run full campaign pipeline
        run: npm run traffic:pipeline

      # 4. Dashboard prioritization
      - name: Dashboard prioritization
        run: node scripts/dashboard-prioritize.mjs

      # 6. Generate social landing pages per producto × canal
      - name: Generate social landings
        run: node scripts/traffic/generate-landing-social.mjs

      # 6.1 GitHub usage and credits guardrail snapshot
      - name: Resource audit snapshot
        run: node scripts/github-resource-audit.mjs --repo "${{ github.repository }}"

      # 7. Agent monitor — escanea todos los agentes y su contribucion
      - name: Agent monitor
        run: node scripts/agent-monitor.mjs

      # 8. Monetization engine — pricing recommendations
      - name: Monetization engine
        run: node scripts/monetization-engine.mjs

      # 9. Product architect — repo blueprints and changelog
      - name: Product architect
        run: node scripts/product-architect.mjs

      # 8. Run autopilot — CHECK ONLY. No publish, no go-live block.
      - name: Run autopilot (check only)
        run: |
          node scripts/traffic/run-autopilot.mjs \
            --channels linkedin,facebook \
            --minChannels 0 || echo "Autopilot check done (non-critical)"

      # 9. Supervisor decisions — product evaluation report
      - name: Supervisor decisions
        run: node scripts/supervisor-decision-maker.mjs report

      # 11. Unified dashboard data — consolida todos los dashboards en un JSON
      - name: Unified dashboard data
        run: node scripts/unified-dashboard-data.mjs

      # 9. System verification — valida cada sistema contra sus entradas/salidas
      - name: System verification
        run: node scripts/verify-systems.mjs

      # 10. Generate daily report
      - name: Generate daily report
        run: |
          echo "## Daily Sales Automation" > daily-report.md
          echo "Date: $(date -u)" >> daily-report.md
          echo "Lead intelligence: completed" >> daily-report.md
          echo "Social pack: generated" >> daily-report.md
          echo "Autopilot: completed" >> daily-report.md
          echo "Dashboard: prioritized" >> daily-report.md
          echo "Social landings: generated" >> daily-report.md
          echo "Agent monitor: completed" >> daily-report.md
          echo "Unified dashboard: generated" >> daily-report.md
          echo "System verification: completed" >> daily-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-sales-report
          path: daily-report.md

      - name: Commit all auto-generated assets
        run: |
          git config user.name "tiger-bot"
          git config user.email "bot@tigerlab.dev"
          git add ops/traffic/outbox/ ops/traffic/research/ ops/traffic/outbox/**-cards/ ops/sales/outreach/ ops/leads/ ops/landings/ ops/artifacts/ ops/runtime/agent-monitor.json ops/runtime/dashboard-unified.json ops/runtime/pricing.json ops/runtime/supervisor-report.json ops/runtime/system-verification.json ops/runtime/github-resource-audit.json ops/runtime/github-resource-audit.md ops/command-center/tasks.json ops/command-center/decisions.json ops/runtime/dashboard-prioritization-report.json
          git diff --cached --quiet || git commit -m "daily-sales: full pipeline $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push or push skipped"
