name: Copilot Agents Validation

on:
  push:
    paths:
      - '.github/copilot/agents/**'
      - 'scripts/validate-copilot-agents.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/copilot-agents-validation.yml'
  pull_request:
    paths:
      - '.github/copilot/agents/**'
      - 'scripts/validate-copilot-agents.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/copilot-agents-validation.yml'

jobs:
  validate-copilot-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate agent YAML contracts
        run: npm run check:copilot:agents
