name: Billing Reconciliation Daily

on:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run billing reconciliation
        run: npm run billing:reconcile

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-reconciliation-report
          path: |
            ops/runtime/billing-reconciliation-report.json
            ops/runtime/billing-reconciliation-report.md
