name: agent-monitor

concurrency:
  group: runtime-ops
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Generate social landings (all products × all channels)
        run: node scripts/traffic/generate-landing-social.mjs

      - name: Agent monitor scan
        run: node scripts/agent-monitor.mjs

      - name: Monetization engine — pricing recommendations
        run: node scripts/monetization-engine.mjs

      - name: Product architect — repo blueprints and changelog
        run: node scripts/product-architect.mjs

      - name: Supervisor decisions — product evaluation report
        run: node scripts/supervisor-decision-maker.mjs report

      - name: Generate unified dashboard data
        run: node scripts/unified-dashboard-data.mjs

      - name: Verify all systems
        run: node scripts/verify-systems.mjs

      - name: Run production gate before commit
        run: npm run prod:gate

      - name: Commit monitor results
        run: |
          git config user.name "tiger-bot"
          git config user.email "bot@tigerlab.dev"
          git add ops/landings/ ops/artifacts/ ops/runtime/agent-monitor.json ops/runtime/dashboard-unified.json ops/runtime/pricing.json ops/runtime/supervisor-report.json ops/runtime/system-verification.json ops/command-center/decisions.json
          git diff --cached --quiet || git commit -m "agent-monitor: scan $(date -u +%Y-%m-%dT%H:%M)"
          git push || echo "Nothing to push or push skipped"
