name: ui-host-pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ui-host/**'
      - '.github/workflows/ui-host-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
    defaults:
      run:
        working-directory: ui-host
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-host/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Check if Pages is enabled
        id: check-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw=$(gh api repos/${{ github.repository }}/pages 2>/dev/null || echo "")
          status=$(echo "$raw" | jq -r '.source.branch // empty' 2>/dev/null || echo "")
          if [ -n "$status" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages enabled: $status"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages not enabled. Skipping deploy."
          fi

      - name: Setup Pages
        if: steps.check-pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.check-pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui-host/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
