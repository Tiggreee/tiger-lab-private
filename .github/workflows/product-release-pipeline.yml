name: product-release-pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "product-*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build release manifest
        run: |
          mkdir -p ops/releases
          cat > ops/releases/latest-release-manifest.json << 'EOF'
          {
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tag": "${GITHUB_REF_NAME}",
            "status": "ok",
            "artifacts": [
              "ops/catalog/products.json",
              "ops/events/schemas/lead.created.json",
              "ops/events/schemas/trial.started.json",
              "ops/events/schemas/payment.succeeded.json",
              "ops/events/schemas/account.provisioned.json"
            ]
          }
          EOF

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: product-release-manifest
          path: ops/releases/latest-release-manifest.json
