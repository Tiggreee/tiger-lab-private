name: contract-tests

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/contract/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HTTP and events contract tests
        run: npm run test:contract
