name: schema-validation

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/contract/**'
      - 'ops/events/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/schema-validation.yml'
  workflow_dispatch:

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate event schemas and catalog contracts
        run: npx vitest run tests/contract/events/events-schema.contract.test.ts
