name: Backend Production Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production-critical test suite (no global coverage gate)
        run: npm run test:unit && npm run test:integration && npm run test:contract && npm run test:e2e && npm run test:smoke

      - name: Build backend
        run: npm run build:server

      - name: Build UI host
        working-directory: ui-host
        run: |
          npm ci
          npm run build

      - name: Check secrets readiness
        run: npm run check:secrets
