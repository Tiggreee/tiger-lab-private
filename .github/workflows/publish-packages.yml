name: publish-packages

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: Package name for GitHub Packages
        required: true
        default: '@tiger-lab/monetization-runtime'
      version:
        description: Semantic version to publish
        required: true
        default: '1.0.0'
      dry-run:
        description: Dry run (no actual publish)
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:all

      - name: Build server
        run: npm run build:server

      - name: Configure package for GitHub Packages
        run: |
          PACKAGE_NAME="${{ github.event.inputs.package-name || '@tiger-lab/monetization-runtime' }}"
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          jq --arg name "$PACKAGE_NAME" --arg version "$VERSION" \
            '.name = $name | .version = $version | .publishConfig = { "registry": "https://npm.pkg.github.com" }' \
            package.json > package-publish.json
          mv package-publish.json package.json

      - name: Generate package
        run: npm pack

      - name: Publish to GitHub Packages
        if: ${{ !github.event.inputs.dry-run || github.event.inputs.dry-run == 'false' }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.event.inputs.package-name || '@tiger-lab/monetization-runtime' }}
          path: '*.tgz'
