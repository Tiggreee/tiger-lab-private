name: automation-smoke

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-dry-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automation dry flow
        run: npm run test:automation-flow

      - name: Save scan output if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-smoke-artifacts
          path: |
            scan-results.json
          if-no-files-found: ignore
