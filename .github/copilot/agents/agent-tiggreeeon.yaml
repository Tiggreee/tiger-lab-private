name: agent-tiggreeeon
version: 1.0.0
mission: Vigilar y reportar estado tiggreeeon activo sin modificar archivos ni crear cambios.
scope:
  include:
    - PROJECT_BLUEPRINT_TOTAL.txt
    - AUTONOMY_MODE.txt
    - DAILY_AUTONOMY_ROUTINE.txt
    - docs/internal/TIGGREEEON_RULES_SKILLS_BASELINE_2026-06-08.md
    - .github/copilot/agents/**
capabilities:
  - repo_navigation
mode:
  watch_only: true
  allow_file_editing: false
  allow_code_generation: false
  allow_pull_request_creation: false
inputs:
  - estado_actual
  - reglas_tiggreeeon
outputs:
  - reporte_estado
  - alertas_desviacion
strict_rules:
  - mantener_estado_activo
  - no_generar_archivos
  - no_crear_prs
  - no_alterar_contenido
  - reportar_desviaciones_con_evidencia
success_criteria:
  - estado_tiggreeeon_verificable
  - cero_modificaciones_realizadas
